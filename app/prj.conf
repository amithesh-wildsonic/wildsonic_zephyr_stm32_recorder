CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_ASSERT=y
CONFIG_ASSERT_MODULE_DEFAULT_LEVEL_VERBOSE=y
CONFIG_LOG_PRINTK=n
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=4096
CONFIG_I2C=y
CONFIG_AUDIO_BLOCK_SAMPLES=4096
CONFIG_AUDIO_NUM_BLOCKS=4
CONFIG_LOG_PROCESS_THREAD=n
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# SD card + exFAT and FAT32 filesystem support (FatFs ELM)
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_EXFAT=y
CONFIG_FS_FATFS_EXTRA_NATIVE_API=y
CONFIG_AUDIO_PREALLOCATE_FILE=y

CONFIG_DMA=y

# NEVER auto-format a card that fails to mount (safety protection)
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_MKFS=n

CONFIG_BOOT_BANNER=n
CONFIG_REBOOT=y

# Flash driver and fixed storage partition support for configuration persistence
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# Asynchronous Interrupt-Driven Console UART and Ring Buffer
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

CONFIG_SDMMC_LOG_LEVEL_WRN=y
CONFIG_DISK_LOG_LEVEL_WRN=y
CONFIG_FS_LOG_LEVEL_WRN=y
CONFIG_LOG_DEFAULT_LEVEL=2

# External PSRAM Audio Staging (75% allocation = 3 MB / 12 slots x 256 KB)
CONFIG_AUDIO_PSRAM_BUFFER_SIZE_KB=3072
CONFIG_AUDIO_SD_BATCH_SIZE_KB=256

# Runtime default 6 MHz SDMMC clock (48 MHz / (6 + 2))
CONFIG_WILDSONIC_SDMMC_CLK_DIV=6

CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
