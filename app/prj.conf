CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_LOG_PRINTK=n
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ISR_STACK_SIZE=8192
CONFIG_AUDIO_BLOCK_SAMPLES=1024
CONFIG_LOG_PROCESS_THREAD=n
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_FPU=y

# SD card + exFAT and FAT32 filesystem support (FatFs ELM)
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_EXFAT=y

CONFIG_DMA=y

# NEVER auto-format a card that fails to mount (safety protection)
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_MKFS=n

CONFIG_SDMMC_LOG_LEVEL_INF=y
CONFIG_DISK_LOG_LEVEL_INF=y
CONFIG_FS_LOG_LEVEL_INF=y
