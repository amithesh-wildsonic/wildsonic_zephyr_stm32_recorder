# Configuration for explicit one-shot exFAT formatting.
CONFIG_PRINTK=y
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_MKFS=y
# Keep automatic formatting on mount failure disabled.
CONFIG_FS_FATFS_MOUNT_MKFS=n
# Enable exFAT support in FatFs engine.
CONFIG_FS_FATFS_EXFAT=y
# Target 32 GB card profile by default (62,333,952 sectors x 512 bytes = ~31.9 GB)
CONFIG_FORMAT_CARD_32GB=y
