# WildSonic Development Build Configuration Fragment
# Enables verbose console logging, thread analyzer, benchmarks, and engineering diagnostics.

CONFIG_WILDSONIC_PROFILE_DEV=y
CONFIG_WILDSONIC_TEST_MARKERS=y
CONFIG_WILDSONIC_VERBOSE_LOGS=y
CONFIG_WILDSONIC_BENCHMARKS=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_BOOT_BANNER=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_DEFAULT_LEVEL_INF=y
CONFIG_SDMMC_LOG_LEVEL_INF=y
CONFIG_DISK_LOG_LEVEL_INF=y
CONFIG_FS_LOG_LEVEL_INF=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_WILDSONIC_SD_FAULT_INJECT=y
