# WildSonic Test / Engineering Build Configuration Fragment
# Enables verbose console logging, SDMMC/disk/FS diagnostics, and batch statistics.

CONFIG_WILDSONIC_VERBOSE_LOGS=y
CONFIG_BOOT_BANNER=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_DEFAULT_LEVEL_INF=y
CONFIG_SDMMC_LOG_LEVEL_INF=y
CONFIG_DISK_LOG_LEVEL_INF=y
CONFIG_FS_LOG_LEVEL_INF=y

# Asynchronous ping-pong storage pipeline for test build
CONFIG_AUDIO_STORAGE_PIPELINE_PSRAM_ASYNC=y
CONFIG_AUDIO_SD_IO_CHUNK_KB=16


