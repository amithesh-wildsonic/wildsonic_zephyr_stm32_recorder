# WildSonic Test / Engineering Build Configuration Fragment
# Enables verbose console logging, SDMMC/disk/FS diagnostics, batch statistics, and test markers.

CONFIG_WILDSONIC_PROFILE_TEST=y
CONFIG_WILDSONIC_TEST_MARKERS=y
CONFIG_WILDSONIC_VERBOSE_LOGS=y
CONFIG_WILDSONIC_TEST_BUILD=y
CONFIG_BOOT_BANNER=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_DEFAULT_LEVEL_INF=y
CONFIG_SDMMC_LOG_LEVEL_INF=y
CONFIG_DISK_LOG_LEVEL_INF=y
CONFIG_FS_LOG_LEVEL_INF=y

CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_WILDSONIC_SD_FAULT_INJECT=y
