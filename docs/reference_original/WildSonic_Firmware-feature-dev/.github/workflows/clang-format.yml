name: test-clang-format

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - uses: DoozyX/clang-format-lint-action@v0.15
      with:
        source: '.'
        exclude: './externals'
        extensions: 'h,hpp,c,cpp'
        clangFormatVersion: 12
